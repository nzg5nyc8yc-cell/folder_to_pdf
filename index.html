<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이미지 폴더 → PDF</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#18243b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.app{max-width:960px;margin:auto}.header{margin-bottom:20px}h1{font-size:27px;margin:0 0 8px}.sub{color:#64748b;margin:0}.panel{background:#fff;border:1px solid #e0e6ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 18px #0e244508}.drop{padding:40px 20px;border:2px dashed #a4b6d1;border-radius:14px;text-align:center;background:#f9fbfe;transition:.2s;cursor:pointer}.drop.over{background:#edf4ff;border-color:#4778e9}.drop strong{display:block;font-size:19px;margin:10px 0}.drop p{color:#64748b;margin:8px 0 20px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button,.fakebutton{border:0;border-radius:10px;font-weight:700;font-size:14px;padding:11px 18px;cursor:pointer;background:#e7eefb;color:#2a4d86}button.primary,.fakebutton.primary{background:#315ee9;color:white}button:disabled{opacity:.45;cursor:not-allowed}.fakebutton input{display:none}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field label{font-weight:700;font-size:13px;display:block;margin-bottom:7px}.field select,.field input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff;font-size:14px}.check{font-size:13px;display:flex;align-items:center;gap:7px;margin-top:12px;color:#334155}.check input{width:auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.hint{font-size:13px;color:#66768c}.files{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:12px;max-height:400px;overflow:auto}.file{border:1px solid #e1e7ef;border-radius:10px;overflow:hidden;background:#fff;position:relative}.file img{width:100%;height:115px;object-fit:contain;background:#f6f8fc;display:block}.fname{font-size:12px;padding:8px;word-break:break-all;min-height:45px}.move{display:flex;gap:5px;justify-content:center;padding:0 8px 8px}.move button{padding:5px 10px;font-size:12px}.status{font-size:13px;color:#334155;margin:12px 0;min-height:20px}.progress{height:9px;background:#e8eef8;border-radius:20px;overflow:hidden}.bar{height:100%;background:#315ee9;width:0;transition:width .15s}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.muted{font-size:12px;color:#64748b}.empty{text-align:center;color:#94a3b8;padding:25px}.hidden{display:none} @media(max-width:650px){.settings{grid-template-columns:1fr}.panel{padding:15px}.drop{padding:26px 12px}h1{font-size:23px}}
</style></head><body><div class="app"><div class="header"><h1>📚 이미지 폴더 → PDF</h1><p class="sub">폴더에 들어 있는 이미지들을 순서대로 하나의 PDF 파일로 만듭니다. 설치·서버 전송 없이 브라우저에서 처리합니다.</p></div>
<section class="panel"><div id="drop" class="drop"><div style="font-size:40px">📁</div><strong>이미지 폴더를 선택하세요</strong><p>폴더 또는 이미지 파일을 이곳에 끌어다 놓아도 됩니다.</p><div class="buttons"><label class="fakebutton primary">폴더 선택<input id="folderInput" type="file" webkitdirectory directory multiple></label><label class="fakebutton">이미지 파일 선택<input id="fileInput" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif,.tif,.tiff" multiple></label></div></div></section>
<section class="panel"><div class="settings"><div class="field"><label for="pageSize">PDF 페이지 크기</label><select id="pageSize"><option value="a4">A4 (이미지 방향 자동 적용)</option><option value="original">이미지 크기에 맞춤</option><option value="letter">Letter (이미지 방향 자동 적용)</option></select></div><div class="field"><label for="quality">화질</label><select id="quality"><option value="0.9">높음 (권장)</option><option value="0.98">최고 (파일 크기 증가)</option><option value="0.75">보통 (용량 절약)</option></select></div><div class="field"><label for="name">PDF 파일 이름</label><input id="name" value="이미지_모음" placeholder="PDF 파일 이름"></div></div><label class="check"><input type="checkbox" id="includeSub">하위 폴더 이미지도 포함 (기본: 현재 폴더만)</label></section>
<section class="panel"><div class="topline"><div><strong>선택된 이미지 <span id="count">0</span>장</strong><div class="hint">기본은 파일명 자연 정렬 (1, 2, 10 순). 화살표로 개별 순서를 변경할 수 있습니다.</div></div><div class="buttons"><button id="sort">이름순 정렬</button><button id="clear">모두 지우기</button></div></div><div id="files" class="files"><div class="empty">선택된 이미지가 없습니다.</div></div><div class="status" id="status" role="status"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="bottom"><span class="muted">이미지마다 PDF 한 페이지 · 가로/세로 용지 자동 전환 · 처리 결과는 내 PC에만 저장</span><button id="convert" class="primary" disabled>PDF 만들기 및 저장</button></div></section>
</div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});const extensions=/\.(jpg|jpeg|png|webp|gif|bmp|avif|tif|tiff)$/i;let items=[],busy=false,urls=[];const encoder=new TextEncoder();
function message(s){$('status').textContent=s}function progress(n){$('bar').style.width=n+'%'}function sortItems(){items.sort((a,b)=>collator.compare(a.path,b.path));render()}
function addFiles(files){if(busy)return;let added=0;const existing=new Set(items.map(x=>x.path+'\0'+x.file.size+'\0'+x.file.lastModified));for(const f of files){const path=f.webkitRelativePath||f._relativePath||f.name;if(!(f.type.startsWith('image/')||extensions.test(f.name)))continue;if(!$('includeSub').checked&&path.includes('/')){const n=path.split('/').filter(Boolean);if(n.length>2)continue;}const key=path+'\0'+f.size+'\0'+f.lastModified;if(existing.has(key))continue;existing.add(key);items.push({file:f,path});added++}sortItems();message(added?`${added}장 추가했습니다. 총 ${items.length}장입니다.`:'추가할 이미지가 없습니다. (하위 폴더 포함 설정을 확인하세요.)')}
function render(){for(const u of urls)URL.revokeObjectURL(u);urls=[];$('count').textContent=items.length;$('convert').disabled=!items.length||busy;const box=$('files');box.innerHTML='';if(!items.length){box.innerHTML='<div class="empty">선택된 이미지가 없습니다.</div>';return}const frag=document.createDocumentFragment();items.forEach((it,i)=>{const card=document.createElement('div');card.className='file';const img=document.createElement('img');const url=URL.createObjectURL(it.file);urls.push(url);img.src=url;img.alt=it.file.name;img.loading='lazy';const label=document.createElement('div');label.className='fname';label.title=it.path;label.textContent=`${i+1}. ${it.path}`;const actions=document.createElement('div');actions.className='move';for(const [symbol,offset] of [['↑',-1],['↓',1]]){const btn=document.createElement('button');btn.textContent=symbol;btn.title='순서 이동';btn.disabled=busy||i+offset<0||i+offset>=items.length;btn.onclick=()=>{[items[i],items[i+offset]]=[items[i+offset],items[i]];render()};actions.append(btn)}card.append(img,label,actions);frag.append(card)});box.append(frag)}
function loadImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(url);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('지원하지 않거나 손상된 이미지: '+file.name))};im.src=url})}
async function jpegData(file,quality){const im=await loadImage(file);const canvas=document.createElement('canvas');canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;if(!canvas.width||!canvas.height)throw Error('이미지 크기가 올바르지 않습니다: '+file.name);const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw Error('브라우저에서 이미지 캔버스를 만들 수 없습니다.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('이미지 변환에 실패했습니다: '+file.name)),'image/jpeg',quality));return{bytes:new Uint8Array(await blob.arrayBuffer()),w:canvas.width,h:canvas.height}}
function concat(parts){const len=parts.reduce((a,b)=>a+b.length,0),out=new Uint8Array(len);let n=0;for(const p of parts){out.set(p,n);n+=p.length}return out}
class PDFWriter{constructor(){this.parts=[];this.size=0;this.offsets=[0];this.put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')}put(x){const b=typeof x==='string'?encoder.encode(x):x;this.parts.push(b);this.size+=b.length}obj(id,body){this.offsets[id]=this.size;this.put(id+' 0 obj\n');this.put(body);this.put('\nendobj\n')}stream(id,header,bytes){this.offsets[id]=this.size;this.put(`${id} 0 obj\n<< ${header} /Length ${bytes.length} >>\nstream\n`);this.put(bytes);this.put('\nendstream\nendobj\n')}finish(total){const start=this.size;this.put(`xref\n0 ${total+1}\n0000000000 65535 f \n`);for(let i=1;i<=total;i++)this.put(String(this.offsets[i]).padStart(10,'0')+' 00000 n \n');this.put(`trailer\n<< /Size ${total+1} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`);return new Blob(this.parts,{type:'application/pdf'})}}
async function createPDF(){if(busy||!items.length)return;busy=true;render();const count=items.length;const quality=Number($('quality').value);const size=$('pageSize').value;const w=new PDFWriter(),kids=[];let success=0;try{for(let i=0;i<count;i++){const item=items[i];message(`변환 중... ${i+1} / ${count}: ${item.file.name}`);progress(i/count*100);await new Promise(r=>setTimeout(r,0));let dat;try{dat=await jpegData(item.file,quality)}catch(e){throw new Error(`${i+1}번째 이미지 처리 실패 — ${e.message}`)}let pw,ph;if(size==='a4'){pw=595.28;ph=841.89}else if(size==='letter'){pw=612;ph=792}else{pw=dat.w*0.75;ph=dat.h*0.75;const scale=Math.min(1,14400/Math.max(pw,ph));pw*=scale;ph*=scale}if(size!=='original'&&dat.w>dat.h){[pw,ph]=[ph,pw]}const scale=Math.min(pw/dat.w,ph/dat.h),dw=dat.w*scale,dh=dat.h*scale,x=(pw-dw)/2,y=(ph-dh)/2;const base=3+i*3,page=base,img=base+1,content=base+2;kids.push(page+' 0 R');w.obj(page,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw.toFixed(3)} ${ph.toFixed(3)}] /Resources << /XObject << /Im0 ${img} 0 R >> >> /Contents ${content} 0 R >>`);w.stream(img,`/Type /XObject /Subtype /Image /Width ${dat.w} /Height ${dat.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode`,dat.bytes);const ops=`q\n${dw.toFixed(4)} 0 0 ${dh.toFixed(4)} ${x.toFixed(4)} ${y.toFixed(4)} cm\n/Im0 Do\nQ\n`;w.stream(content,'',encoder.encode(ops));success++}w.obj(2,`<< /Type /Pages /Count ${success} /Kids [${kids.join(' ')}] >>`);w.obj(1,'<< /Type /Catalog /Pages 2 0 R >>');const pdf=w.finish(2+3*success);let filename=$('name').value.trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,'_')||'이미지_모음';if(!filename.toLowerCase().endsWith('.pdf'))filename+='.pdf';const url=URL.createObjectURL(pdf);const link=document.createElement('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);progress(100);message(`완료! ${success}페이지 PDF를 저장했습니다. (${(pdf.size/1048576).toFixed(1)} MB)`)}catch(e){message('오류: '+e.message);console.error(e)}finally{busy=false;render()}}
$('folderInput').addEventListener('change',e=>{addFiles(Array.from(e.target.files));e.target.value=''});$('fileInput').addEventListener('change',e=>{addFiles(Array.from(e.target.files));e.target.value=''});$('clear').onclick=()=>{if(busy)return;items=[];render();progress(0);message('목록을 비웠습니다.')};$('sort').onclick=sortItems;$('convert').onclick=createPDF;const drop=$('drop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',async e=>{e.preventDefault();drop.classList.remove('over');if(busy)return;const entries=Array.from(e.dataTransfer.items||[]).map(i=>i.webkitGetAsEntry?.()).filter(Boolean);if(!entries.length){addFiles(Array.from(e.dataTransfer.files));return}const files=[];async function walk(entry,prefix=''){if(entry.isFile){await new Promise(resolve=>entry.file(f=>{f._relativePath=prefix+f.name;files.push(f);resolve()},()=>resolve()))}else if(entry.isDirectory){const reader=entry.createReader();let children=[];for(;;){const batch=await new Promise(resolve=>reader.readEntries(resolve,()=>resolve([])));if(!batch.length)break;children.push(...batch)}for(const c of children)await walk(c,prefix+entry.name+'/')}}for(const en of entries)await walk(en);addFiles(files)});render();
})();
</script></body></html>
